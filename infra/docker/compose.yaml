name: educatech
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: educatech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Configure APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sh:/docker-entrypoint-initdb.d/00-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d educatech"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ["--migrate", "--bootstrap"]
    environment:
      ConnectionStrings__Database: Host=db;Database=educatech;Username=postgres;Password=${POSTGRES_PASSWORD}
      Bootstrap__Email: ${BOOTSTRAP_EMAIL:?Configure BOOTSTRAP_EMAIL}
      Bootstrap__Password: ${BOOTSTRAP_PASSWORD:?Configure BOOTSTRAP_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=db;Database=educatech;Username=educatech_app;Password=${APP_DB_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Configure JWT_KEY}
      AllowedHosts: localhost;127.0.0.1
    ports: ["127.0.0.1:5080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
volumes:
  postgres_data:
